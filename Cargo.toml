[package]
name = "autobricks-dns"
version = "0.1.0"
edition = "2021"
description = "Standalone DNS service for Autobricks internal names"
license = "GPL-3.0-only"

[lints.rust]
unsafe_code = "deny"
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[dependencies]
ini = { package = "rust-ini", version = "0.21" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
overflow-checks = true
panic = "abort"
